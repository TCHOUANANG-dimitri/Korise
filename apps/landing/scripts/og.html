<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@700&family=Urbanist:wght@500;600&display=block" rel="stylesheet">
<style>
/*%%TOKENS%%*/
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--background);color:var(--surface);font-family:Urbanist,sans-serif}
.g{position:absolute;right:-220px;top:-260px;width:900px;height:900px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}
.w{position:relative;padding:64px 72px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:18px;font:700 52px/1 Signika}
.logo img{width:72px;height:72px;border-radius:18px}
h1{font:700 76px/1.04 Signika;margin:44px 0 22px;letter-spacing:-1px;max-width:900px}
h1 em{font-style:normal;color:var(--accent)}
p{font-size:30px;color:rgba(255,255,255,.75);margin:0}
.b{margin-top:auto;display:flex;gap:16px;align-items:center}
.pill{background:var(--accent);color:var(--background);font:600 28px Urbanist;padding:16px 30px;border-radius:16px}
.s{font-size:24px;color:rgba(255,255,255,.6)}
</style></head><body><div class="g"></div><div class="w">
<div class="logo"><img src="%%LOGO%%">Korise</div>
<h1>Votre argent et votre stock, <em>sous contrôle.</em></h1>
<p>Il manque 6 000 FCFA ce soir ? Korise vous dit combien, quand et qui.</p>
<div class="b"><span class="pill">Essai gratuit · 15 jours</span><span class="s">Ventes · Caisse · Stock · Employés</span></div>
</div></body></html>
